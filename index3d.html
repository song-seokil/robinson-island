<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>로빈슨의 섬 — 3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #06131f; overflow: hidden; }
      canvas { display: block; touch-action: none; }
      #hud {
        position: fixed; left: 12px; top: 12px; color: #dff0ff;
        font: 13px/1.5 system-ui, "Malgun Gothic", sans-serif;
        background: rgba(6,19,31,.55); padding: 8px 12px; border-radius: 10px;
        pointer-events: none;
      }
      #inv {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        display: flex; gap: 14px; align-items: center;
        background: rgba(6,19,31,.62); padding: 10px 18px; border-radius: 14px;
        pointer-events: none; font: 15px/1 system-ui, "Malgun Gothic", sans-serif;
        color: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.35);
      }
      #inv .i { font-size: 19px; margin-right: 5px; }
      #inv b { font-weight: 700; font-size: 17px; }
      #inv .empty { opacity: .4; }
      #bmenu {
        position: fixed; left: 12px; bottom: 14px; display: flex; gap: 8px;
        pointer-events: auto;
      }
      #bmenu .bi {
        width: 54px; height: 54px; border: 2px solid rgba(255,255,255,.25);
        border-radius: 12px; background: rgba(6,19,31,.72); color: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2px; cursor: pointer; font: 11px/1 system-ui, "Malgun Gothic", sans-serif;
      }
      #bmenu .bi { position: relative; }
      #bmenu .bi .ic { font-size: 22px; }
      #bmenu .bi .cst { opacity: .85; font-size: 10px; }
      #bmenu .bi .qty {
        position: absolute; right: -3px; top: -5px; font-size: 10px; font-weight: 700;
        background: rgba(6,19,31,.9); border: 1px solid rgba(255,255,255,.3);
        border-radius: 7px; padding: 1px 4px; color: #cfe6ff;
      }
      #bmenu .bi.on { border-color: #7CFC9A; background: rgba(20,70,45,.85); }
      #bmenu .bi.poor { opacity: .45; }
      #bmenu .bi.lock { opacity: .32; cursor: not-allowed; }
      /* ---- 스킬북 (18-19) ---- */
      #bookmenu {
        position: fixed; right: 12px; bottom: 62px; width: 54px; height: 54px;
        border: 2px solid rgba(255,255,255,.25); border-radius: 12px;
        background: rgba(6,19,31,.72); font-size: 24px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      #bookmenu.on { border-color: #ffd76a; background: rgba(70,55,15,.85); }
      #book {
        position: fixed; right: 12px; bottom: 126px; display: none; gap: 10px;
        padding: 12px; border-radius: 14px; pointer-events: auto;
        background: rgba(6,19,31,.86); border: 1px solid rgba(255,215,106,.35);
      }
      #book.show { display: flex; }
      #book .sk {
        position: relative; width: 56px; height: 60px; border-radius: 12px;
        border: 2px solid rgba(255,255,255,.22); background: rgba(16,34,52,.9);
        color: #fff; cursor: pointer; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1px;
      }
      #book .sk .ic { font-size: 24px; }
      #book .sk .gv { font-size: 11px; opacity: .8; }
      #book .sk.ready { border-color: #ffd76a; }
      #book .sk.doing { border-color: #7CFC9A; }
      #book .sk.done { border-color: rgba(255,255,255,.5); opacity: .75; }
      #book .sk.lock { opacity: .35; cursor: not-allowed; }
      #book .sk .lk { position: absolute; inset: 0; display: flex;
        align-items: center; justify-content: center; font-size: 20px; }
      #book .sk .ck { position: absolute; right: 3px; top: 2px; font-size: 11px; color: #7CFC9A; }
      #book .sk .bar {
        position: absolute; left: 5px; right: 5px; bottom: 5px; height: 4px;
        background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden;
      }
      #book .sk .bar i { display: block; height: 100%; background: #7CFC9A; }
      #tip {
        position: fixed; right: 12px; bottom: 16px; color: #dff0ff; opacity: .6;
        font: 11px/1.4 system-ui, "Malgun Gothic", sans-serif; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hud">로빈슨의 섬 · 3D</div>
    <div id="inv"></div>
    <div id="bmenu"></div>
    <button id="bookmenu">📘</button>
    <div id="book"></div>
    <div id="tip">노드 클릭 = 채집 지시 · 하단 메뉴 = 건설 · 건물 클릭 = 철거<br>크루조가 알아서 이동합니다</div>
    <script type="module" src="/src3d/main.ts"></script>
  </body>
</html>
