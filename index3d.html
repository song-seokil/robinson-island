<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>로빈슨의 섬 — 3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #06131f; overflow: hidden; }
      canvas { display: block; touch-action: none; }
      #hud {
        position: fixed; left: 12px; top: 12px; color: #dff0ff;
        font: 13px/1.5 system-ui, "Malgun Gothic", sans-serif;
        background: rgba(6,19,31,.55); padding: 8px 12px; border-radius: 10px;
        pointer-events: none;
      }
      #inv {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        display: flex; gap: 14px; align-items: center;
        background: rgba(6,19,31,.62); padding: 10px 18px; border-radius: 14px;
        pointer-events: none; font: 15px/1 system-ui, "Malgun Gothic", sans-serif;
        color: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.35);
      }
      #inv .i { font-size: 19px; margin-right: 5px; }
      #inv b { font-weight: 700; font-size: 17px; }
      #inv .empty { opacity: .4; }

      /* ---- 하단 버튼 2개 ---- */
      .fab {
        position: fixed; bottom: 76px; width: 56px; height: 56px;
        border: 2px solid rgba(255,255,255,.28); border-radius: 14px;
        background: rgba(6,19,31,.78); font-size: 25px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 14px rgba(0,0,0,.4);
      }
      #buildmenu { left: 12px; }
      #bookmenu  { right: 12px; }
      #buildmenu.on { border-color: #7CFC9A; background: rgba(20,70,45,.9); }
      #bookmenu.on  { border-color: #ffd76a; background: rgba(70,55,15,.9); }

      /* ---- 패널 공통 (건설 목록 / 스킬북) ---- */
      .panel {
        position: fixed; display: none; flex-direction: column; gap: 8px;
        padding: 10px; border-radius: 16px; z-index: 20;
        background: rgba(8,20,32,.94); border: 1px solid rgba(255,255,255,.18);
        box-shadow: 0 10px 34px rgba(0,0,0,.55);
      }
      .panel.show { display: flex; }
      .panel .bhead {
        display: flex; align-items: center; gap: 8px; color: #dff0ff;
        font: 13px/1 system-ui, "Malgun Gothic", sans-serif; padding: 0 2px 4px;
      }
      .panel .bhead .bk { font-size: 20px; }
      .panel .bhead .bc { opacity: .7; }
      .panel .bhead .bs { color: #7CFC9A; font-weight: 700; }
      .panel .bhead .bx {
        margin-left: auto; width: 26px; height: 26px; border-radius: 8px;
        background: rgba(255,255,255,.1); border: none; color: #fff;
        font-size: 13px; cursor: pointer;
      }
      .panel .bempty {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        color: #9fb6cc; font: 12px/1.4 system-ui, "Malgun Gothic", sans-serif;
        padding: 18px 10px;
      }
      .panel .bempty span:first-child { font-size: 30px; opacity: .5; }

      /* ---- 건설 목록 (아래에서 올라온다) ---- */
      #bpanel {
        left: 12px; bottom: 142px; width: 264px; max-height: 62vh; overflow-y: auto;
      }
      #bpanel .bi {
        position: relative; display: grid; grid-template-columns: 34px 1fr auto;
        align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px;
        border: 2px solid rgba(255,255,255,.14); background: rgba(18,38,58,.85);
        color: #fff; cursor: pointer; text-align: left;
      }
      #bpanel .bi .ic { font-size: 24px; grid-row: 1 / 3; }
      #bpanel .bi .nm { font: 13px/1.2 system-ui, "Malgun Gothic", sans-serif; }
      #bpanel .bi .cst { font: 11px/1.2 system-ui, "Malgun Gothic", sans-serif; opacity: .85; }
      #bpanel .bi .qty {
        grid-row: 1 / 3; font: 11px/1 system-ui, sans-serif; opacity: .8;
        border: 1px solid rgba(255,255,255,.22); border-radius: 7px; padding: 3px 5px;
      }
      #bpanel .bi.on { border-color: #7CFC9A; }
      #bpanel .bi.poor { opacity: .42; }

      /* ---- 스킬북 (책) ---- */
      #book {
        right: 12px; bottom: 142px; width: 320px; max-height: 74vh; overflow-y: auto;
      }
      #book .bch {
        display: flex; align-items: center; gap: 6px; margin-top: 6px;
        color: #ffd76a; font: 12px/1 system-ui, "Malgun Gothic", sans-serif;
        border-bottom: 1px solid rgba(255,215,106,.28); padding-bottom: 4px;
      }
      #book .bch b { font-size: 15px; }
      #book .sk {
        position: relative; display: grid; grid-template-columns: 34px 1fr;
        align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px;
        border: 2px solid rgba(255,255,255,.14); background: rgba(16,34,52,.85);
        color: #fff; cursor: pointer; text-align: left;
      }
      #book .sk .ic { font-size: 23px; grid-row: 1 / 4; }
      #book .sk .nm { font: 13px/1.2 system-ui, "Malgun Gothic", sans-serif; font-weight: 700; }
      #book .sk .ef { font: 11px/1.3 system-ui, "Malgun Gothic", sans-serif; opacity: .82; }
      #book .sk .mt { font: 10px/1.2 system-ui, sans-serif; opacity: .6; }
      #book .sk.ready { border-color: #ffd76a; }
      #book .sk.doing { border-color: #7CFC9A; }
      #book .sk.done { opacity: .62; border-color: rgba(255,255,255,.2); }
      #book .sk.lock { opacity: .34; cursor: not-allowed; }
      #book .sk .lk {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        font-size: 15px;
      }
      #book .sk .ck { position: absolute; right: 8px; top: 6px; font-size: 12px; color: #7CFC9A; }
      #book .sk .bar {
        position: absolute; left: 6px; right: 6px; bottom: 4px; height: 4px;
        background: rgba(255,255,255,.16); border-radius: 3px; overflow: hidden;
      }
      #book .sk .bar i { display: block; height: 100%; background: #7CFC9A; }

      #tip {
        position: fixed; right: 12px; bottom: 18px; color: #dff0ff; opacity: .55;
        font: 11px/1.4 system-ui, "Malgun Gothic", sans-serif; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hud">로빈슨의 섬 · 3D</div>
    <div id="inv"></div>
    <button id="buildmenu" class="fab">🏗</button>
    <button id="bookmenu" class="fab">📘</button>
    <div id="bpanel" class="panel"></div>
    <div id="book" class="panel"></div>
    <div id="tip">노드 클릭 = 채집 지시 · 건물 클릭 = 철거<br>크루조가 알아서 이동합니다</div>
    <script type="module" src="/src3d/main.ts"></script>
  </body>
</html>
